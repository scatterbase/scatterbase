[workspace]
resolver = "2"
members = [
    "crates/scatter-claims",
    "crates/scatterbase-kernel",
    "crates/scatterbase-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/scatterbase/scatterbase"

[workspace.dependencies]
scatter-claims = { path = "crates/scatter-claims" }
scatterbase-kernel = { path = "crates/scatterbase-kernel" }

rand = "0.8.5"
dotenv = "0.15.0"
ed25519-dalek = "2.0.0"
rand_core = "0.6.4"
sha2 = "0.10.7"
data-encoding = "2.4.0"
chrono = "0.4.26"
# The shared log crates. They are not on crates.io yet, so they are taken from the
# triplespace repository at a pinned commit.
scatter-log = { git = "https://github.com/scatterbase/triplespace", rev = "7129144e1bf4e8ca86b2ca838a7657a267a3a6c0" }
scatter-integrity = { git = "https://github.com/scatterbase/triplespace", rev = "7129144e1bf4e8ca86b2ca838a7657a267a3a6c0" }
# Driving the log's futures from synchronous code: the file backend does its I/O inline
pollster = "1"

# RDF terms and I/O: the oxrdf family, as the shared scatter crates use
oxrdf = { version = "0.3", features = ["rdf-12"] }
oxttl = { version = "0.2", features = ["rdf-12"] }
thiserror = "2"
tempfile = "3.8.0"
