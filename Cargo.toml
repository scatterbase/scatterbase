[workspace]
resolver = "2"
members = [
    "crates/scatter-claims",
    "crates/scatter-quadstore",
    "crates/scatterbase-kernel",
    "crates/scatterbase-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/scatterbase/scatterbase"

[workspace.dependencies]
scatter-claims = { path = "crates/scatter-claims" }
scatter-quadstore = { path = "crates/scatter-quadstore" }
scatterbase-kernel = { path = "crates/scatterbase-kernel" }

rand = "0.8.5"
dotenv = "0.15.0"
ed25519-dalek = "2.0.0"
rand_core = "0.6.4"
sha2 = "0.10.7"
data-encoding = "2.4.0"
chrono = "0.4.26"
# The shared scatter crates, taken from the triplespace repository at one pinned commit:
# the log crates are not on crates.io yet, and scatter-vocab's published version predates
# the claim and key terms.
scatter-vocab = { git = "https://github.com/scatterbase/triplespace", rev = "7839c357743fa2024bdb88bbff7dac4ae3e89f68" }
scatter-actors = { git = "https://github.com/scatterbase/triplespace", rev = "7839c357743fa2024bdb88bbff7dac4ae3e89f68" }
scatter-log = { git = "https://github.com/scatterbase/triplespace", rev = "7839c357743fa2024bdb88bbff7dac4ae3e89f68" }
scatter-integrity = { git = "https://github.com/scatterbase/triplespace", rev = "7839c357743fa2024bdb88bbff7dac4ae3e89f68" }
# Driving the log's futures from synchronous code: the file backend does its I/O inline
pollster = "1"

# RDF terms and I/O: the oxrdf family, as the shared scatter crates use
oxrdf = { version = "0.3", features = ["rdf-12"] }
oxttl = { version = "0.2", features = ["rdf-12"] }
thiserror = "2"
tempfile = "3.8.0"
